name: App macOS
on:
  push:
    paths: ["mac/**", ".github/workflows/macos.yml"]
jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen
        working-directory: mac
      - name: Tests
        working-directory: mac
        run: xcodebuild test -project Space.xcodeproj -scheme Space -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
